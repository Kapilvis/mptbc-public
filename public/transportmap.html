<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Location Map</title>
    <!-- Use standard Leaflet CDN for reliable CSS delivery -->
    <link
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #map {
        height: 100vh;
        width: 100%;
      }

      /* Pulsing GPS animation */
      @keyframes gpsPulse {
        0% {
          transform: scale(0.6);
          opacity: 1;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      /* Bouncing loading truck animation */
      @keyframes truckBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .loading-truck-svg {
        animation: truckBounce 1s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- Use standard Leaflet CDN for reliable JS delivery -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      function getQueryParams() {
        const params = {};
        const queryString = window.location.search.substring(1);
        if (!queryString) return params;
        const queryParts = queryString.split("&");
        queryParts.forEach((part) => {
          const [key, value] = part.split("=");
          params[decodeURIComponent(key)] = decodeURIComponent(value);
        });
        return params;
      }

      async function getLocationName(lat, lng) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
        try {
          const response = await fetch(url, {
            headers: {
              "Accept-Language": "en",
            },
          });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          return data.display_name || "Unknown Location";
        } catch (error) {
          console.error("Geocoding error:", error);
          return "Location found at coordinates";
        }
      }

      document.addEventListener("DOMContentLoaded", async function () {
        const params = getQueryParams();
        const lat = parseFloat(params.lat);
        const lng = parseFloat(params.lng);
        const vehicleName = params.name || "Vehicle";

        if (isNaN(lat) || isNaN(lng)) {
          document.getElementById("map").innerHTML =
            '<div style="padding: 20px; font-family: sans-serif; text-align: center;"><h3>Invalid Coordinates</h3><p>Please provide lat and lng query parameters.</p></div>';
          return;
        }

        // Initialize the map and marker
        const map = L.map("map").setView([lat, lng], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap contributors",
        }).addTo(map);

        // Define custom green pulsing truck marker
        const truckMarkerHtml = `
                <div style="position: relative; width: 40px; height: 40px;">
                    <div style="position: absolute; top: 0; left: 0; width: 40px; height: 40px; border-radius: 50%; background: rgba(16, 185, 129, 0.4); animation: gpsPulse 1.8s infinite ease-in-out;"></div>
                    <div style="position: absolute; top: 5px; left: 5px; width: 30px; height: 30px; border-radius: 50%; background: #10b981; border: 2px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
                        <svg style="width: 16px; height: 16px; fill: white;" viewBox="0 0 24 24">
                            <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm2-5.5h-3V9h3v4z"/>
                        </svg>
                    </div>
                </div>
            `;

        const customIcon = L.divIcon({
          html: truckMarkerHtml,
          className: "custom-gps-marker",
          iconSize: [40, 40],
          iconAnchor: [20, 20],
          popupAnchor: [0, -10],
        });

        // Add a marker to the map immediately
        const marker = L.marker([lat, lng], { icon: customIcon })
          .addTo(map)
          .bindPopup(
            `
                    <div style="font-family: sans-serif; min-width: 180px;">
                        <h4 style="margin: 0 0 5px 0; color: #1e293b; font-size: 13px;">${vehicleName}</h4>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <svg class="loading-truck-svg" style="width: 22px; height: 22px; fill: #0284c7;" viewBox="0 0 24 24">
                                <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm2-5.5h-3V9h3v4z"/>
                            </svg>
                            <span style="font-size: 11px; color: #64748b; font-weight: 500;">Resolving live location...</span>
                        </div>
                    </div>
                `,
          )
          .openPopup();

        // Fetch initial location name
        const locationName = await getLocationName(lat, lng);
        const isTransit = params.status === "In Transit";

        marker.setPopupContent(`
                <div style="font-family: sans-serif; min-width: 180px;">
                    <h4 style="margin: 0 0 5px 0; color: #1e293b; font-size: 13px;">${vehicleName}</h4>
                    <span style="font-size: 11px; color: #0f172a; font-weight: 500; line-height: 1.4; display: block;">${locationName}</span>
                </div>
            `);

        if (isTransit) {
          let theta = 0;
          let currentLat = lat;
          let currentLng = lng;
          // Accumulate steps Northeastward to simulate real highway progression
          const latStep = 0.0003;
          const lngStep = 0.0004;

          setInterval(async () => {
            theta += 0.2;
            currentLat += latStep + Math.sin(theta) * 0.00005;
            currentLng += lngStep + Math.cos(theta * 0.7) * 0.00005;

            marker.setLatLng([currentLat, currentLng]);
            map.panTo([currentLat, currentLng]);

            const movingLoc = await getLocationName(currentLat, currentLng);
            marker.setPopupContent(`
                        <div style="font-family: sans-serif; min-width: 180px;">
                            <h4 style="margin: 0 0 5px 0; color: #1e293b; font-size: 13px;">${vehicleName}</h4>
                            <span style="font-size: 11px; color: #0f172a; font-weight: 500; line-height: 1.4; display: block; margin-bottom: 6px;">${movingLoc}</span>
                            <div style="display: flex; align-items: center; gap: 4px; font-size: 9px; color: #059669; font-weight: bold; background: #ecfdf5; padding: 3px 6px; border-radius: 4px; border: 1px solid #a7f3d0; width: fit-content;">
                                <span style="width: 5px; height: 5px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
                                Vehicle In-Transit (Moving)
                            </div>
                        </div>
                    `);
          }, 3000);
        }
      });
    </script>
  </body>
</html>
