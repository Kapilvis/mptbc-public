<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPTBC — Static Prototype | म.प्र. पाठ्य पुस्तक निगम</title>
<style>
:root{
  --navy:#08263f;
  --panel:#123f63;
  --sky:#1ba4dd;
  --sky2:#33c1f2;
  --btn:#1e88b8;
  --btn2:#127a56;
  --bg:#eef3f7;
  --card:#ffffff;
  --line:#cfdce6;
  --line2:#e4edf3;
  --text:#16202b;
  --muted:#5c7386;
  --hl:#fffbe0;
  --tealcard:#12938a;
  --redcard:#cf4f4a;
  --bluecard:#2b7fb8;
  --darkcard:#37475a;
  --ok:#177a45;
  --warn:#b3600d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nirmala UI","Noto Sans Devanagari","Kokila","Mangal","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.45;
}
a{color:#12608f;text-decoration:none}
button{font-family:inherit}

/* ---------- top chrome ---------- */
.topstrip{background:var(--navy);color:#fff;padding:6px 14px;display:flex;align-items:center;gap:14px;font-size:12.5px}
.topstrip .portal{flex:1;text-align:center;font-weight:700;letter-spacing:.3px;color:#8fd8ff}
.topstrip .u{opacity:.9;margin-left:14px}
.topstrip .u b{color:#fff}
.brandband{background:linear-gradient(90deg,var(--sky) 0%,var(--sky2) 55%,#8ad6f2 100%);
  color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px;border-bottom:3px solid #0d6f9c}
.logo{width:40px;height:40px;margin-right:10px;border-radius:50%;background:#fff;color:var(--navy);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;text-align:center;
  border:2px solid #0d6f9c;line-height:1.05}
.brandband h1{margin:0;font-size:19px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.brandband h1 small{display:block;font-size:11.5px;font-weight:600;opacity:.95}
.brandband .sub{margin-left:auto;font-size:11.5px;text-align:right;opacity:.95}

.menubar{background:#e8f6fd;border-bottom:1px solid #b9dced;padding:0 8px;display:flex;flex-wrap:wrap;align-items:stretch}
.menubar .mi{padding:7px 12px;border-right:1px solid #cbe6f4;font-size:12.5px;cursor:pointer;white-space:nowrap}
.menubar .mi:hover{background:#d3ecf9}
.menubar .mi.active{background:var(--panel);color:#fff}
.menubar .right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:4px 8px}

/* ---------- layout ---------- */
.wrap{display:flex;min-height:calc(100vh - 150px);align-items:stretch}
.side{width:268px;flex:0 0 268px;background:#fff;border-right:1px solid var(--line);overflow:auto}
.side .roleSel{padding:8px;border-bottom:1px solid var(--line2);background:#f6fafd}
.side .roleSel label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.grp{border-bottom:1px solid var(--line2)}
.grp>.gh{padding:8px 10px;font-weight:700;font-size:12.5px;background:#f3f8fb;cursor:pointer;
  display:flex;align-items:center;gap:6px;color:#123f63}
.grp>.gh:hover{background:#e7f2f9}
.grp>.gh .ch{margin-left:auto;font-size:10px;color:var(--muted)}
.grp .items{display:none;padding:2px 0 6px}
.grp.open .items{display:block}
.grp .items a{display:block;padding:5px 10px 5px 24px;font-size:12.3px;color:#24435c;border-left:3px solid transparent}
.grp .items a:hover{background:#f0f7fb}
.grp .items a.sel{background:#e3f2fb;border-left-color:var(--sky);font-weight:600;color:#0c4c73}
.grp .items a i{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}

.main{flex:1;padding:12px;min-width:0}
.crumb{font-size:11.5px;color:var(--muted);margin:0 2px 8px}
.crumb b{color:#123f63}

/* ---------- panel ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:2px;margin-bottom:14px;box-shadow:0 1px 2px rgba(10,40,70,.06)}
.ph{background:var(--panel);color:#fff;padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
.ph .en{font-weight:600;opacity:.92}
.ph .tag{margin-left:auto;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.3);padding:2px 7px;border-radius:10px}
.pb{padding:12px}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 12px;background:#f7fbfd;border-bottom:1px solid var(--line2)}
.tb .sp{flex:1}

/* ---------- form ---------- */
.fgrid{display:flex;flex-wrap:wrap;gap:10px 22px;display:grid;grid-template-columns:1fr 1fr}
.fgrid>.fld{flex:1 1 340px;min-width:0}
.fgrid.one{grid-template-columns:1fr}
.fld{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start;padding:2px 0}
.fld.wide{grid-column:1 / -1}
.lbl{font-size:12.5px;font-weight:600;color:#1d3346;padding-top:5px}
.lbl i{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--muted)}
.lbl .req{color:#c0392b;margin-left:2px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;padding:5px 7px;border:1px solid #b9c9d6;border-radius:2px;background:#fff;font-size:12.5px;
  font-family:inherit;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid #7fc7ea;outline-offset:0;border-color:#4aa8d8}
textarea{min-height:52px;resize:vertical}
input[readonly]{background:#eef3f7;color:#44586b}
.hint{font-size:10.8px;color:var(--muted);margin-top:2px}
.chkrow{display:flex;flex-wrap:wrap;gap:14px;padding-top:5px;font-size:12.3px}
.chkrow label{display:flex;gap:5px;align-items:center}
.fileBox{border:1px dashed #9fbdd0;background:#f6fbfe;padding:7px 9px;font-size:12px;color:#40607a;border-radius:2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);color:#fff;border:1px solid #14709b;
  padding:5px 12px;border-radius:2px;font-size:12.4px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.save{background:var(--btn2);border-color:#0d5c40}
.btn.gray{background:#e9eff4;color:#2b4256;border-color:#c3d2dd}
.btn.warn{background:#b3600d;border-color:#8c4a09}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;padding:11px 12px;background:#f7fbfd;border-top:1px solid var(--line2)}

/* ---------- table ---------- */
.tblwrap{overflow:auto}
table.grid{width:100%;border-collapse:collapse;font-size:12.3px}
table.grid th{background:#dfeef7;border:1px solid #b9d5e6;padding:6px 7px;text-align:left;font-weight:700;color:#12405f;vertical-align:top}
table.grid th i{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:#4d6f88}
table.grid td{border:1px solid #dbe6ee;padding:5px 7px;vertical-align:top}
table.grid tbody tr:nth-child(even){background:#f8fbfd}
table.grid tbody tr:hover{background:var(--hl)}
table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid td.act a{margin-right:8px;font-size:11.8px}
.mini input{padding:3px 5px;font-size:11.5px}
.pager{display:flex;gap:4px;padding:9px 12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager b{display:inline-block;min-width:24px;text-align:center;border:1px solid #c3d5e2;padding:2px 6px;background:#fff;cursor:pointer;font-weight:600}
.pager b.on{background:var(--panel);color:#fff;border-color:var(--panel)}

/* ---------- badges / status ---------- */
.bdg{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;border:1px solid}
.bdg.ok{background:#e6f6ec;color:#177a45;border-color:#a9dcbe}
.bdg.pend{background:#fff5e2;color:#a35d09;border-color:#f0d19a}
.bdg.rej{background:#fdeceb;color:#b5322b;border-color:#f2b8b4}
.bdg.info{background:#e8f2fb;color:#1b5d8c;border-color:#b6d5ec}

/* ---------- KPI cards ---------- */
.kpis{display:flex;flex-wrap:wrap;gap:11px;display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{flex:1 1 210px}
.kpi{color:#fff;border-radius:3px;overflow:hidden}
.kpi .t{padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.4px;background:rgba(0,0,0,.13)}
.kpi .v{padding:9px 10px 4px;display:flex;align-items:center;gap:10px}
.kpi .v .ic{font-size:26px;opacity:.85}
.kpi .v .n{font-size:25px;font-weight:800;line-height:1}
.kpi .v .n small{display:block;font-size:10.5px;font-weight:600;opacity:.9;letter-spacing:.3px}
.kpi .f{display:flex;background:rgba(0,0,0,.16)}
.kpi .f div{flex:1;padding:5px 10px;font-size:10.5px;font-weight:600}
.kpi .f div b{display:block;font-size:14px}
.kpi.a{background:var(--tealcard)} .kpi.b{background:var(--redcard)}
.kpi.c{background:var(--bluecard)} .kpi.d{background:var(--darkcard)}

.cols2{display:flex;flex-wrap:wrap;gap:14px;display:grid;grid-template-columns:1fr 1fr}
.cols2>*{flex:1 1 320px;min-width:0}
.cols3{display:flex;flex-wrap:wrap;gap:14px;display:grid;grid-template-columns:1fr 1fr 1fr}
.cols3>*{flex:1 1 260px;min-width:0}
.cols37{display:flex;flex-wrap:wrap;gap:14px;display:grid;grid-template-columns:38fr 62fr}
.cols37>*{min-width:0}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:12px;height:210px;padding:24px 6px 0;border-bottom:1px solid var(--line)}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .bar .b{width:100%;border-radius:2px 2px 0 0;position:relative}
.chart .bar .b span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:#3b5468}
.chart .bar .l{font-size:10.5px;color:var(--muted);margin-top:5px;text-align:center;line-height:1.2}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);padding:8px 4px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- activity ---------- */
.acts{padding:4px 0}
.acts .a{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:12.3px}
.acts .a .d{margin-left:auto;font-size:10.8px;color:var(--muted);white-space:nowrap}
.acts .a .i{width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:0 0 22px}

/* ---------- login ---------- */
.loginwrap{min-height:100vh;background:linear-gradient(160deg,#0b3453,#12628d 55%,#1ba4dd);display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:940px;max-width:100%;background:#fff;border-radius:4px;overflow:hidden;display:grid;grid-template-columns:1fr 380px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.loginbox .l{padding:34px;background:linear-gradient(150deg,#0d3d5f,#1a6c9b);color:#fff}
.loginbox .l h2{margin:14px 0 4px;font-size:24px}
.loginbox .l p{opacity:.9;font-size:12.5px;margin:0 0 18px}
.loginbox .l ul{margin:0;padding-left:16px;font-size:12.3px;opacity:.92}
.loginbox .l ul li{margin-bottom:5px}
.loginbox .r{padding:28px 26px}
.loginbox .r h3{margin:0 0 2px;font-size:17px;color:#12405f}
.loginbox .r .sm{font-size:11.5px;color:var(--muted);margin-bottom:16px}
.loginbox .r .fld{grid-template-columns:1fr;gap:3px;margin-bottom:11px}
.cap{display:flex;gap:8px;align-items:center}
.cap .cimg{background:repeating-linear-gradient(45deg,#e7eff5,#e7eff5 6px,#d7e5ee 6px,#d7e5ee 12px);
  border:1px solid #b9c9d6;padding:5px 12px;font-weight:800;letter-spacing:5px;font-style:italic;color:#2a4a63;font-size:15px}

/* ---------- misc ---------- */
.note{background:#fff8e1;border:1px solid #f0dca4;padding:8px 11px;font-size:12px;color:#6b5312;border-radius:2px;margin-bottom:12px}
.note b{color:#5a4409}
.footer{background:var(--navy);color:#9fc4dd;text-align:center;padding:10px;font-size:11.5px}
.toast{position:fixed;right:16px;bottom:16px;background:#123f63;color:#fff;padding:10px 16px;border-radius:3px;
  font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.22s;z-index:99}
.toast.on{opacity:1;transform:none}
.tabs{display:flex;gap:2px;padding:8px 12px 0;background:#f7fbfd;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs .t{padding:5px 12px;font-size:12.2px;border:1px solid var(--line);border-bottom:none;background:#e8f1f7;cursor:pointer;border-radius:3px 3px 0 0;color:#33566f}
.tabs .t.on{background:#fff;font-weight:700;color:#0f4a70;position:relative;top:1px}
.srsref{font-size:11px;color:var(--muted);padding:6px 12px;background:#fafcfe;border-top:1px dashed var(--line)}
.searchScr{padding:8px;border-bottom:1px solid var(--line2)}
.searchScr input{font-size:12.3px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.cols2,.cols3,.cols37{grid-template-columns:1fr}
 .fgrid{grid-template-columns:1fr}.side{width:220px;flex-basis:220px}}
@media(max-width:760px){.wrap{flex-direction:column}.side{width:100%;flex-basis:auto}.fld{grid-template-columns:1fr}
 .loginbox{grid-template-columns:1fr}.loginbox .l{display:none}}
@media print{.side,.menubar,.topstrip{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ==========================================================================
   MPTBC — Computerization of M.P. Text Book Corporation
   STATIC PROTOTYPE (screen mock-ups) — derived from SRS v1.4 dated 21-08-2017
   All data shown is dummy sample data for screen visualisation only.
   ========================================================================== */
/* ---------------- sample data pools (dummy) ---------------- */
var POOL = {
  depot:["भोपाल","इंदौर","ग्वालियर","जबलपुर","उज्जैन","सागर","रीवा","शहडोल","गुना","होशंगाबाद","सिवनी","मुरैना"],
  printer:["मेसर्स अजन्ता पैकेजिंग","जी टेक प्रिंट वर्क्स","मेसर्स जयेश ऑफ़सेट प्रिंटर्स","मेसर्स दृष्टि ऑफ़सेट","मेसर्स एम.के. ऑफ़सेट","श्री बालाजी प्रिंटर्स","न्यू लक्ष्मी ऑफ़सेट"],
  title:["भाषा भारती - 1","भाषा भारती - 2","सहायक वाचन - 6","इंग्लिश रीडर जनरल सीरीज - 1","गणित - 5","विज्ञान - 8","सामाजिक विज्ञान - 7","संस्कृत भारती - 6","हमारा पर्यावरण - 4"],
  mill:["आई.टी.सी. लिमिटेड","जे.के. पेपर मिल्स","सेंचुरी पल्प एंड पेपर","एमामी पेपर मिल्स","टी.एन.पी.एल.","बल्लारपुर इंडस्ट्रीज"],
  seller:["श्री बुक डिपो, भोपाल","सरस्वती पुस्तक भंडार, इंदौर","विद्या बुक सेंटर, ग्वालियर","न्यू कॉलेज बुक हाउस, जबलपुर","शारदा एजेंसी, उज्जैन"],
  transporter:["मेसर्स राजदूत ट्रांसपोर्ट","भारत कैरियर्स","श्री गणेश रोडवेज","मालवा लॉजिस्टिक्स"],
  employee:["आर. के. शर्मा","सुनीता वर्मा","प्रवीण सिंह भाटी","अमृतांश तिवारी","मीना चौहान","दिनेश पटेल","एस. के. जैन"],
  desig:["सहायक प्रबंधक","लेखापाल","डिपो प्रबंधक","वरिष्ठ लिपिक","उप प्रबंधक","भण्डार पाल"],
  block:["हुजूर","बैरसिया","सांवेर","देपालपुर","सिहोरा","पाटन","महू"],
  papertype:["मुद्रण पेपर 58 GSM","मुद्रण पेपर 60 GSM","कवर पेपर 170 GSM","कवर पेपर 200 GSM","मैपलिथो 70 GSM"],
  cls:["कक्षा 1","कक्षा 2","कक्षा 3","कक्षा 4","कक्षा 5","कक्षा 6","कक्षा 7","कक्षा 8"],
  subject:["हिन्दी","अंग्रेजी","गणित","विज्ञान","सामाजिक विज्ञान","संस्कृत","उर्दू"],
  medium:["हिन्दी","अंग्रेजी","उर्दू","मराठी"],
  scheme:["नि:शुल्क पाठ्यपुस्तक योजना","सामान्य विक्रय","आर.एस.के. मांग","सी.पी.आई. मांग"],
  status:["स्वीकृत","लंबित","निरस्त","प्रक्रियाधीन","पूर्ण"],
  bank:["स्टेट बैंक ऑफ इंडिया","बैंक ऑफ इंडिया","पंजाब नेशनल बैंक","सेंट्रल बैंक ऑफ इंडिया"],
  court:["माननीय उच्च न्यायालय, जबलपुर","जिला न्यायालय, भोपाल","श्रम न्यायालय, इंदौर"],
  advtype:["त्यौहार अग्रिम","अनाज अग्रिम","चिकित्सा अग्रिम","यात्रा अग्रिम","भण्डार अग्रिम"],
  yr:["2024-2025","2025-2026","2026-2027"]
};
function pick(a,i){ return a[i % a.length]; }
function pad(n,w){ n=String(n); while(n.length<w) n="0"+n; return n; }
function dt(i,base){ base=base||10; var d=new Date(2026,(i*2+3)%12,((i*5)%27)+1);
  return pad(d.getDate(),2)+"-"+pad(d.getMonth()+1,2)+"-"+d.getFullYear(); }
function money(i){ return (1250000 + i*387450).toLocaleString('en-IN'); }
function qty(i){ return (12000 + i*8450).toLocaleString('en-IN'); }

/* auto-generate a believable cell value from the English column label */
function cellFor(en, i, hi, ci){
  ci = ci||0; i = i + ci*3;
  var s=(en||"").toLowerCase(), h=(hi||"");
  if(s==="#"||s.indexOf("sr")===0||s.indexOf("s.no")>=0||s==="क्र.") return i+1;
  if(s.indexOf("action")>=0) return "ACT";
  if(s.indexOf("status")>=0) return "BDG";
  if(s.indexOf("select")>=0||s.indexOf("check")>=0) return "CHK";
  if(s.indexOf("entry")>=0&&s.indexOf("field")>=0) return "INP";
  if(s.indexOf("academic year")>=0||s.indexOf("financial year")>=0||s==="year") return pick(POOL.yr,i);
  if(s.indexOf("year")>=0) return pick(POOL.yr,i);
  if(s.indexOf("printer type")>=0||s.indexOf("printers type")>=0||s.indexOf("seller category")>=0||s.indexOf("category")>=0)
     return ["श्रेणी अ / Category A","श्रेणी ब / Category B","श्रेणी स / Category C"][i%3];
  if(s.indexOf("type")>=0&&s.indexOf("paper")<0&&s.indexOf("machine")<0&&s.indexOf("advance")<0&&s.indexOf("house")<0)
     return ["सामान्य / General","विशेष / Special","नियमित / Regular"][i%3];

  if(s.indexOf("date")>=0) return dt(i);
  if(s.indexOf("printer")>=0||s.indexOf("press")>=0) return pick(POOL.printer,i);
  if(s.indexOf("depot")>=0||s.indexOf("depo")>=0) return pick(POOL.depot,i);
  if(s.indexOf("mill")>=0||s.indexOf("vendor")>=0&&s.indexOf("paper")>=0) return pick(POOL.mill,i);
  if(s.indexOf("transport")>=0) return pick(POOL.transporter,i);

/* parse "हिन्दी|English|type|options" */
function F(str){
  var p=String(str).split("|");
  return {hi:p[0]||"", en:p[1]||"", type:p[2]||"text", opt:(p[3]||""), extra:(p[4]||"")};
}
function C(str){
  var p=String(str).split("|");
  return {hi:p[0]||"", en:p[1]||"", w:p[2]||""};
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function fieldHTML(f){
  var req = (f.extra.indexOf("o")>=0) ? "" : '<span class="req">*</span>';
  var ctl="";
  var opts = f.opt? f.opt.split(","): [];
  switch(f.type){
    case "select":
      ctl='<select>'+(opts.length?opts:["चयन करें / Select"]).map(function(o,i){return '<option>'+esc(o)+'</option>';}).join("")+'</select>';
      break;
    case "date": ctl='<input type="text" value="'+(f.opt||dt(2))+'" placeholder="DD-MM-YYYY">'; break;
    case "num": ctl='<input type="text" value="'+(f.opt||"")+'" placeholder="0">'; break;
    case "ro": ctl='<input type="text" value="'+esc(f.opt||"")+'" readonly>'; break;
    case "area": ctl='<textarea placeholder="'+esc(f.opt||"")+'"></textarea>'; break;
    case "file": ctl='<div class="fileBox">📎 फ़ाइल चुनें / Choose file &nbsp; <span style="color:#7d94a6">'+(f.opt||"PDF / JPG, max 2 MB")+'</span></div>'; break;
    case "chk": ctl='<div class="chkrow">'+opts.map(function(o){return '<label><input type="checkbox"> '+esc(o)+'</label>';}).join("")+'</div>'; break;
    case "radio": ctl='<div class="chkrow">'+opts.map(function(o,i){return '<label><input type="radio" name="r'+Math.random().toString(36).slice(2,6)+'" '+(i?"":"checked")+'> '+esc(o)+'</label>';}).join("")+'</div>'; break;
    default: ctl='<input type="text" value="'+esc(f.opt||"")+'">';
  }
  var cls = (f.extra.indexOf("w")>=0)? "fld wide":"fld";
  return '<div class="'+cls+'"><div class="lbl">'+esc(f.hi)+req+'<i>'+esc(f.en)+'</i></div><div>'+ctl+
    (f.extra.indexOf("h")>=0?'<div class="hint">'+esc(f.extra.split("~")[1]||"")+'</div>':'')+'</div></div>';
}

function tableHTML(cols, nrows, opts){
  opts=opts||{};
  var th = cols.map(function(c){
    var cl = /qty|amount|no\.|total|%|ton/i.test(c.en)? ' class="num"':'';
    return '<th'+cl+(c.w?' style="width:'+c.w+'px"':'')+'>'+esc(c.hi)+'<i>'+esc(c.en)+'</i></th>';
  }).join("");
  var body="";
  for(var r=0;r<nrows;r++){
    var tds = cols.map(function(c,ci){
      var v = cellFor(c.en, r, c.hi, ci);
      if(v==="ACT") return '<td class="act"><a href="#" onclick="tst(\'संपादन / Edit — prototype\');return false">संपादन/Edit</a><a href="#" onclick="tst(\'विवरण / View detail — prototype\');return false">विवरण/View</a><a href="#" onclick="tst(\'निष्क्रिय / Delete — prototype\');return false">हटाएँ/Delete</a></td>';
      if(v==="BDG"){ var s=["ok","pend","info","rej"][r%4], t=["स्वीकृत / Approved","लंबित / Pending","प्रक्रियाधीन / In process","निरस्त / Rejected"][r%4];
        return '<td><span class="bdg '+s+'">'+t+'</span></td>'; }
      if(v==="CHK") return '<td style="text-align:center"><input type="checkbox"></td>';
      if(v==="INP") return '<td class="mini"><input type="text" value="0"></td>';
      var cl = /qty|amount|no\.|total|%|ton|quantity|balance|stock/i.test(c.en)? ' class="num"':'';
      return '<td'+cl+'>'+esc(v)+'</td>';
    }).join("");
    body+='<tr>'+tds+'</tr>';
  }
  var tot = opts.total? '<tfoot><tr style="background:#eaf3f9;font-weight:700">'+cols.map(function(c,i){
      return i===0? '<td colspan="1">योग / Total</td>' : (/qty|amount|total|quantity|ton/i.test(c.en)? '<td class="num">'+qty(9+i*4)+'</td>':'<td></td>');
    }).join("")+'</tr></tfoot>':'';
  return '<div class="tblwrap"><table class="grid"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody>'+tot+'</table></div>';
}

function kpi(cls,ic,title,val,unit,f1l,f1v,f2l,f2v){
  return '<div class="kpi '+cls+'"><div class="t">'+title+'</div>'+
   '<div class="v"><div class="ic">'+ic+'</div><div class="n">'+val+'<small>'+unit+'</small></div></div>'+
   '<div class="f"><div>'+f1l+'<b>'+f1v+'</b></div><div>'+f2l+'<b>'+f2v+'</b></div></div></div>';
}
function chartBars(data,color){
  var max = Math.max.apply(null,data.map(function(d){return d[1];}));
  return '<div class="chart">'+data.map(function(d,i){
    var h=Math.round(d[1]/max*100);
    var c = color || ["#d9534f","#e8833a","#e8b23a","#c9d14a","#7fc04a","#4aa96c","#3f97b8","#3f6fb8"][i%8];
    return '<div class="bar"><div class="b" style="height:'+h+'%;background:'+c+'"><span>'+d[1].toLocaleString('en-IN')+'</span></div><div class="l">'+d[0]+'</div></div>';
  }).join("")+'</div>';
}
